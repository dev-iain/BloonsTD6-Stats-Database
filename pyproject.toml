[project]
name = "btd6"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "hypothesis>=6.170.15",
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "ANN", "FA", "C90", "PLR0915", "PLR0912", "E741"]

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = ["btd6/"]
